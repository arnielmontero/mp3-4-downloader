# Rate limiting zone (in addition to the application-level limits)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Request bodies are tiny JSON documents; anything bigger is rejected before PHP sees it.
    client_max_body_size 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # ---- security headers (HSTS is added by the TLS-terminating reverse proxy in production) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://i.ytimg.com https://*.ytimg.com; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---- static frontend ----
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        # add_header in a location resets inherited headers, so repeat the important ones
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://i.ytimg.com https://*.ytimg.com; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location ~ /\. { deny all; }

    # ---- REST API -> PHP-FPM (CodeIgniter front controller) ----
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 95s;
        fastcgi_buffering off;
        fastcgi_hide_header X-Powered-By;
        # security headers are added once, here (PHP also sets them when run without nginx)
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header Cross-Origin-Resource-Policy;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # ---- completed files: reachable ONLY through X-Accel-Redirect from /api/download/{id}/file ----
    location /_protected_downloads/ {
        internal;
        alias /var/www/storage/downloads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, no-store" always;
    }

    # Never expose the storage tree or application code directly.
    location ~ ^/(storage|backend|application|vendor|system)/ { return 404; }
}
