; Application PHP settings (production-oriented)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 128M
max_execution_time = 90
post_max_size = 16K
upload_max_filesize = 1K
max_file_uploads = 0
file_uploads = Off
allow_url_fopen = Off
allow_url_include = Off
session.auto_start = 0
date.timezone = UTC
opcache.enable = 1
opcache.enable_cli = 0
