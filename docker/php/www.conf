[www]
; PHP-FPM pool for the API. The container runs as www-data (non-root), so no user/group directives.
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; /api/video/info may wait on yt-dlp (INFO_TIMEOUT_SECONDS, default 60)
request_terminate_timeout = 90s
